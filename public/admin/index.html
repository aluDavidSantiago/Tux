<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0D0D0E">
  <title>Tux · Admin</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M12 3a4 9 0 0 1 0 18"/><circle cx="12" cy="12" r="1.5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 10a6 6 0 1 1 12 0c0 4.5 1.5 6 2 6.5H4c.5-.5 2-2 2-6.5zM10 19.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-image-off" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="m4 4 16 16"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4.5v4h-4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 19 6v5.5c0 4.3-3 7.8-7 9-4-1.2-7-4.7-7-9V6z"/><path d="m9 12 2 2 4-4.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5v-2a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-6.5 18-4.5-7-7-4.5z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19.5 4.5 11 13M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM16.5 9.5l5 5M21.5 9.5l-5 5"/></symbol>
  </svg>

  <div class="admin-shell">
    <header class="admin-header">
      <a class="brand" href="../" aria-label="Volver a Tux">
        <img class="brand-logo" src="../img/logo.png" alt="" draggable="false">
        <span>Tux</span>
        <span class="admin-tag">Admin</span>
      </a>
      <div class="admin-user" id="admin-user"></div>
    </header>
    <main class="admin-main" id="admin-main">
      <div class="admin-loading"><img class="loading-mark tux-logo" src="../img/logo.png" alt=""></div>
    </main>
  </div>

  <!-- Visor multimedia / 360° (mismo componente que la app) -->
  <dialog tabindex="-1" class="sheet viewer" id="viewer-modal" aria-label="Visor multimedia">
    <div class="viewer-stage" id="viewer-stage"></div>
    <div class="viewer-loading" id="viewer-loading" hidden><img class="loading-mark tux-logo" src="../img/logo.png" alt=""></div>
    <div class="viewer-top">
      <span class="badge-360" id="viewer-badge" hidden><svg class="icon"><use href="#i-orbit"/></svg>360°</span>
      <button class="sheet-close on-media static" type="button" data-close aria-label="Cerrar"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <div class="viewer-bottom">
      <div class="viewer-caption">
        <b id="viewer-title"></b>
        <span id="viewer-sub"></span>
      </div>
      <button class="glass-btn" id="viewer-sound" type="button" aria-label="Activar sonido" hidden>
        <svg class="icon"><use href="#i-mute"/></svg>
      </button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
